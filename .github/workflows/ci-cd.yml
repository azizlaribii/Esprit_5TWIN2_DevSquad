# =============================================================================
# Pipeline CI/CD - TexTileCycle (groupe DevSquad)
#
#  CI (a chaque push et chaque Pull Request) :
#    1. backend-tests   : PHP 8.3, composer install, php artisan test
#    2. migrations-mysql: migrations sur une vraie base MySQL 8
#    3. python-checks   : verification de la syntaxe des services Python
#
#  CD (uniquement quand le code arrive sur main, et seulement si la CI est verte) :
#    4. docker-publish  : construction de l'image Docker du backend
#                         puis publication sur GitHub Container Registry (GHCR)
# =============================================================================
name: CI-CD

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Si on pousse deux fois de suite sur la meme branche, on annule l'ancien run
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # CI 1/3 : tests automatiques du backend Laravel
  # ---------------------------------------------------------------------------
  backend-tests:
    name: Backend - tests PHPUnit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: textile-cycle-backend
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3, gd, intl, zip, bcmath, curl, xml, fileinfo
          coverage: none

      - name: Cache des dependances Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('textile-cycle-backend/composer.lock') }}
          restore-keys: composer-

      - name: Installer les dependances (composer install)
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Preparer le fichier .env
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Lancer les tests (php artisan test)
        run: php artisan test

  # ---------------------------------------------------------------------------
  # CI 2/3 : les migrations passent-elles sur une vraie base MySQL ?
  # (les tests utilisent SQLite en memoire, ce job verifie MySQL comme en vrai)
  # ---------------------------------------------------------------------------
  migrations-mysql:
    name: Backend - migrations MySQL
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: textile-cycle-backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: textilecycle
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql, gd, intl, zip, bcmath, curl, xml, fileinfo
          coverage: none

      - name: Installer les dependances (composer install)
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Preparer le fichier .env
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Executer toutes les migrations sur MySQL
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: textilecycle
          DB_USERNAME: root
          DB_PASSWORD: ""
        run: php artisan migrate --force

  # ---------------------------------------------------------------------------
  # CI 3/3 : verification des services Python (syntaxe)
  # On n'installe pas PyTorch en CI : trop lourd (plusieurs Go) pour un controle de syntaxe.
  # ---------------------------------------------------------------------------
  python-checks:
    name: Python - verification de la syntaxe
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compiler tous les fichiers Python des services IA
        run: |
          python -m compileall -q \
            depot-ai-service \
            ai-service \
            textile-cycle-ai

  # ---------------------------------------------------------------------------
  # CD : publication de l'image Docker du backend sur GHCR
  # Ne se lance que sur main, apres succes de TOUS les jobs de CI ci-dessus.
  # ---------------------------------------------------------------------------
  docker-publish:
    name: CD - image Docker vers GHCR
    runs-on: ubuntu-latest
    needs: [backend-tests, migrations-mysql, python-checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Nom d'image en minuscules (obligatoire pour GHCR)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/textilecycle-backend" >> "$GITHUB_ENV"

      - name: Preparer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion a GHCR (avec le jeton automatique de GitHub)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculer les tags de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Construire et publier l'image
        uses: docker/build-push-action@v6
        with:
          context: ./textile-cycle-backend
          file: ./textile-cycle-backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
