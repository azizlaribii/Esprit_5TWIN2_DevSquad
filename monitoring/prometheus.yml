global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Base de donnees MySQL
  - job_name: mysql
    static_configs:
      - targets: ["mysqld-exporter:9104"]

  # Conteneurs Docker (CPU, memoire, reseau)
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Disponibilite et temps de reponse de l'application Laravel
  - job_name: laravel-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://app/login
          - http://app/
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
