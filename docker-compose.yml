# =============================================================================
# Lancer TexTileCycle avec Docker :
#     docker compose up --build
# Application : http://localhost:8000
# Comptes de demo : voir le document DevOps / README
# =============================================================================
services:
  db:
    image: mysql:8.0
    container_name: textilecycle-db
    environment:
      MYSQL_DATABASE: textilecycle
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Port 3307 cote Windows pour ne pas entrer en conflit avec XAMPP (3306)
    ports:
      - "3307:3306"

  app:
    build:
      context: ./textile-cycle-backend
    container_name: textilecycle-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      APP_KEY: ${APP_KEY:-}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: textilecycle
      DB_USERNAME: root
      DB_PASSWORD: ""
      MAIL_MAILER: log
      SESSION_DRIVER: file
      CACHE_DRIVER: file
      AI_SERVICE_URL: http://ai:8001
      RUN_MIGRATIONS: "true"
    ports:
      - "8000:80"
    volumes:
      - app_storage:/var/www/html/storage/app

  # Service IA analytique (optionnel) : docker compose --profile ai up --build
  ai:
    profiles: ["ai"]
    build:
      context: ./textile-cycle-ai
    container_name: textilecycle-ai
    ports:
      - "8001:8001"

volumes:
  db_data:
  app_storage:
