# =============================================================================
# Lancer TexTileCycle avec Docker :
#     docker compose up --build
# Application : http://localhost:8000
#
# Avec TOUS les services IA (analytique 8001, depot 8002, reparation 5000) :
#     docker compose --profile ai up --build
# =============================================================================
services:
  db:
    image: mysql:8.0
    container_name: textilecycle-db
    environment:
      MYSQL_DATABASE: textilecycle
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "3307:3306"

  app:
    build:
      context: ./textile-cycle-backend
    container_name: textilecycle-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      APP_KEY: ${APP_KEY:-}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: textilecycle
      DB_USERNAME: root
      DB_PASSWORD: ""
      MAIL_MAILER: log
      SESSION_DRIVER: file
      CACHE_DRIVER: file
      AI_SERVICE_URL: http://ai:8001
      AI_SERVICE_SECRET: textilecycle_secret_key_2026
      DEPOT_AI_URL: http://depot-ai:8002
      FLASK_AI_URL: http://reparation-ai:5000
      RUN_MIGRATIONS: "true"
    ports:
      - "8000:80"
    volumes:
      - app_storage:/var/www/html/storage/app

  ai:
    profiles: ["ai"]
    build:
      context: ./textile-cycle-ai
    container_name: textilecycle-ai
    environment:
      AI_SERVICE_SECRET: textilecycle_secret_key_2026
    ports:
      - "8001:8001"

  depot-ai:
    profiles: ["ai"]
    build:
      context: ./depot-ai-service
    container_name: textilecycle-depot-ai
    ports:
      - "8002:8002"

  reparation-ai:
    profiles: ["ai"]
    build:
      context: ./ai-service/reparation-ai-service
    container_name: textilecycle-reparation-ai
    ports:
      - "5000:5000"

volumes:
  db_data:
  app_storage:
